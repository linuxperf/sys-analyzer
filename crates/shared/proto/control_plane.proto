syntax = "proto3";

package sys_analyzer.control.v1;

service AgentRegistration {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
}

message RegisterRequest {
  string agent_id = 1;
  string hostname = 2;
  uint32 pid = 3;
  string version = 4;
  repeated string labels = 5;
  map<string, string> metadata = 6;
  // Reuse this ID when retrying the same registration. Empty disables replay.
  string registration_attempt_id = 7;
}

message RegisterResponse {
  string session_id = 1;
  uint64 heartbeat_interval_ms = 2;
  uint64 lease_timeout_ms = 3;
}

message HeartbeatRequest {
  string agent_id = 1;
  int64 sent_at_unix_ms = 2;
  // The session ID returned by Register. Older clients omit this field.
  optional string session_id = 3;
}

enum HeartbeatDirective {
  HEARTBEAT_DIRECTIVE_UNSPECIFIED = 0;
  HEARTBEAT_DIRECTIVE_CONTINUE = 1;
  HEARTBEAT_DIRECTIVE_REREGISTER = 2;
  HEARTBEAT_DIRECTIVE_STOP = 3;
}

message HeartbeatResponse {
  HeartbeatDirective directive = 1;
  // Set only when the heartbeat renews a lease.
  int64 lease_expires_at_unix_ms = 2;
}

message DeregisterRequest {
  string agent_id = 1;
  string reason = 2;
  // The current session ID returned by Register.
  string session_id = 3;
}

message DeregisterResponse {}
